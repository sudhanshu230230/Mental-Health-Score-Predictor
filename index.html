<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Mental Health Score Predictor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Student Mental Health Score</h1>
      <p>Enter a student's profile and daily habits to predict their mental health score.</p>
    </header>

    <div class="layout">
      <form id="predict-form" class="card" novalidate>
        <fieldset>
          <legend>Profile</legend>
          <div class="grid">
            <label>Age
              <input type="number" name="Age" min="14" max="45" step="1" required>
            </label>
            <label>Gender
              <select name="Gender" required></select>
            </label>
            <label>Academic level
              <select name="Academic_Level" required></select>
            </label>
            <label>Country
              <select name="Grouped_Country" required></select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Social media</legend>
          <div class="grid">
            <label>Most used platform
              <select name="Most_Used_Platform" required></select>
            </label>
            <label>Main purpose of use
              <select name="Purpose_Of_Use" required></select>
            </label>
            <label>Avg. daily usage (hours)
              <input type="number" name="Avg_Daily_Usage_Hours" min="0" max="24" step="0.1" required>
            </label>
            <label>Daily phone unlocks
              <input type="number" name="Daily_Unlocks" min="0" max="500" step="1" required>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Lifestyle</legend>
          <div class="grid">
            <label>Study hours (per day)
              <input type="number" name="Study_Hours" min="0" max="16" step="0.1" required>
            </label>
            <label>Sleep hours (per night)
              <input type="number" name="Sleep_Hours_Per_Night" min="0" max="14" step="0.1" required>
            </label>
            <label>Physical activity (hours/day)
              <input type="number" name="Physical_Activity_Hours" min="0" max="12" step="0.1" required>
            </label>
            <label>Stress level
              <select name="Stress_Level" required></select>
            </label>
          </div>
        </fieldset>

        <div id="error" class="alert" role="alert" hidden></div>

        <div class="actions">
          <button type="submit" id="submit-btn" class="btn primary">Predict score</button>
          <button type="reset" class="btn">Reset</button>
        </div>
      </form>

      <aside id="result" class="card result" aria-live="polite">
        <div class="placeholder"><p>Your prediction will appear here.</p></div>
      </aside>
    </div>

    <footer class="footer">
      <span id="api-status" class="status">Checking API…</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
